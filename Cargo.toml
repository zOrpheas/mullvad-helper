[workspace]
members = [
  "crates/core",
  "crates/backend",
  "crates/privileged-helper",
  "crates/cli",
  "crates/gui",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Mullvad Helper Contributors"]
license = "GPL-3.0-or-later"
homepage = "https://github.com/example/mullvad-helper"
repository = "https://github.com/example/mullvad-helper"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1"
chrono = "0.4"
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
mullvad-helper-core = { path = "crates/core" }
mullvad-helper-backend = { path = "crates/backend" }
